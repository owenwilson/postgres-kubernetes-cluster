---
# vars:
#   k8s_version: "v1.37"

- name: reset all kubernetes nodes
  ansible.builtin.include_tasks:
    file: ./uninstall_kubernetes_ubuntu_24_04.yml
  when: 
    - uninstall is defined
    - uninstall == "true"

- name: install dependencies
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
    state: present
  when: uninstall is not defined or uninstall != "true"

- name: create folder /etc/apt/keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: uninstall is not defined or uninstall != "true"

- name: download key GPG Kubernetes
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/Release.key"
    dest: /tmp/kubernetes-release.key
    mode: '0644'
  when: uninstall is not defined or uninstall != "true"

- name: convert gpg key to keyring
  ansible.builtin.shell: |
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: uninstall is not defined or uninstall != "true"

- name: add repositorie APT Kubernetes
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: |
      deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ k8s_version }}/deb/ /
    mode: '0644'
  when: uninstall is not defined or uninstall != "true"

- name: update cache
  ansible.builtin.apt:
    update_cache: yes
  when: uninstall is not defined or uninstall != "true"

- name: install kubelet kubeadm kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
  when: uninstall is not defined or uninstall != "true"

- name: lock kubernetes package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when: uninstall is not defined or uninstall != "true"

- name: disable swap
  ansible.builtin.command: swapoff -a
  changed_when: false
  when: uninstall is not defined or uninstall != "true"

- name: retrieve information about installed packages
  ansible.builtin.package_facts:
    manager: auto
  when: uninstall is not defined or uninstall != "true"

- name: show installed kubernetes packages
  ansible.builtin.debug:
    msg: "show installed packages: {{ ansible_facts.packages.keys() | select('search' , 'kube' ) | list }}"
  when: uninstall is not defined or uninstall != "true"
