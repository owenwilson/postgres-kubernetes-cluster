---
- name: Show the OS distrubution and version
  ansible.builtin.debug:
    msg: "This server is running {{ ansible_distribution }} version {{ ansible_distribution_version }}"

- name: Perform task only on Ubuntu 24.04
  ansible.builtin.include_tasks:
    file: linux/install_kubernetes_ubuntu_24_04.yml
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version == "24.04"

- name: configure containerd for kubernetes
  ansible.builtin.include_tasks:
    file: linux/containerd_configuration.yml
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version == "24.04"

- name: initialize the master node with kubeadm
  ansible.builtin.include_tasks:
    file: linux/init_master_node.yml
  when:
    - inventory_hostname in groups['master']
    - init_node is defined
    - init_node == 'masters'

- name: Unir workers cuando se solicite explícitamente
  ansible.builtin.include_tasks:
    file: linux/join_workers.yml
  when:
    - inventory_hostname in groups['workers']
    - init_node is defined
    - init_node == 'workers'

