#  args:
#    creates: /etc/containerd/config.toml
#  when: not containerd_config.stat.exists
#  notify: restart containerd

- name: generate default configuration containerd
  ansible.builtin.command: containerd config default
  register: containerd_default
  changed_when: false
  when: not containerd_config.stat.exists

- name: write config.toml with default configuration
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ containerd_default.stdout }}"
    mode: '0644'
  when: not containerd_config.stat.exists
  notify: restart containerd

- name: enable SystemCgroup in containerd
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: restart containerd

- name: create a configuration complete bookmark
  ansible.builtin.file:
    path: /etc/containerd/.ansible_configured
    state: touch
    mode: '0644'
  when: not containerd_marker.stat.exists

