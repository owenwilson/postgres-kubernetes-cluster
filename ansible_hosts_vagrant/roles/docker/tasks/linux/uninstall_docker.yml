---
- name: Clean old docker version
  ansible.builtin.apt:
    autoremove: yes
    purge: yes
    state: absent
    pkg:
      - docker-ce
      - docker-engine
      - docker-ce-cli
      - docker-doc
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - docker-compose-v2
      - docker-compose

- name: Remove docker-compose old version
  ansible.builtin.file:
    path: /usr/bin/docker-compose
    state: absent

- name: Remove old docker folder
  ansible.builtin.file:
    path: /var/lib/docker
    state: absent

- name: Remove old containerd
  ansible.builtin.file:
    path: /var/lib/containerd
    state: absent

- name: Remove docker.source file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.sources
    state: absent

- name: Remove docker.asc file
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.asc
    state: absent